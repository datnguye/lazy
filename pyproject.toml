[project]
name = "lazy-plugin-build"
version = "0.1.0"
description = "Build tooling that renders the lazy plugin into every agent format."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.27.1",
]

[project.scripts]
lazy = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated output embeds authored markdown; its line lengths are the skill's,
# not the generator's. Lint the source, not the render.
extend-exclude = ["plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLC0415"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
