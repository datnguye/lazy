name: Claude Code

on:
  push:
    branches: [main]
    paths: &paths
      - src/**
      - pyproject.toml
      - uv.lock
      - plugins/**
      - .claude-plugin/**
      - .github/workflows/ci-claude.yml
  pull_request:
    paths: *paths

jobs:
  render:
    name: Validate the rendered plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Render
        run: uv run lazy render -f claude

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate plugin manifest
        run: claude plugin validate ./plugins/lazy

  install:
    name: Install from the marketplace
    if: github.event_name == 'push'
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add the marketplace
        run: claude plugin marketplace add datnguye/lazy

      - name: Install the plugin
        run: claude plugin install lazy@datnguye -y

      - name: Plugin is installed
        run: |
          claude plugin list --json | tee installed.json
          grep -q 'lazy@datnguye' installed.json

      - name: Components load
        run: claude plugin details lazy@datnguye
