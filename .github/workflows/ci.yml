name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      - name: Render every format
        run: uv run lazy render

      - name: Render is reproducible
        run: uv run lazy check

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate plugin manifest
        run: claude plugin validate ./plugins/lazy

  install:
    name: Install from the marketplace
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add the marketplace
        run: claude plugin marketplace add datnguye/lazy

      - name: Install the plugin
        run: claude plugin install lazy@datnguye -y

      - name: Plugin is installed
        run: |
          claude plugin list --json | tee installed.json
          grep -q 'lazy@datnguye' installed.json

      - name: Components load
        run: claude plugin details lazy@datnguye
